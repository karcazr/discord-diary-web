<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="하루를 기록하고, 꾸준히 쓴 만큼 보상을 받는 웹 일기장입니다.">
  <title>하루 일기</title>
  <meta name="theme-color" content="#151715">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./style.css?v=2">
  <script src="./config.js" defer></script>
  <script src="./app.js?v=2" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="./"><span class="brand-icon" aria-hidden="true"></span>하루 일기</a>
    <nav class="navigation" id="navigation" aria-label="일기장 메뉴">
      <button class="nav-item" type="button" data-tab="diary" aria-current="page"><span class="icon i-diary" aria-hidden="true"></span>내 일기</button>
      <button class="nav-item" type="button" data-tab="community"><span class="icon i-community" aria-hidden="true"></span>공유 일기</button>
      <button class="nav-item" type="button" data-tab="shop"><span class="icon i-shop" aria-hidden="true"></span>상점</button>
      <button class="nav-item" type="button" data-tab="profile"><span class="icon i-profile" aria-hidden="true"></span>내 정보</button>
      <button class="nav-item settings-nav" type="button" data-tab="settings"><span class="icon i-settings" aria-hidden="true"></span>설정</button>
    </nav>
  </aside>
  <div class="workspace">
    <header class="top">
      <a class="brand mobile-brand" href="./"><span class="brand-icon" aria-hidden="true"></span>하루 일기</a>
      <div id="account"><button class="login-button" id="login" type="button">로그인</button></div>
    </header>
    <main id="root" aria-busy="true">
      <div class="heading">
        <h1>내 일기</h1>
        <button type="button" data-action="login">＋ <span>일기 쓰기</span></button>
      </div>
      <div class="layout guest-layout">
        <section class="panel empty-journal">
          <div class="empty-icon" aria-hidden="true"><span class="icon i-diary"></span></div>
          <p>로그인하고 일기를 쓰세요.</p>
        </section>
        <section class="panel week-preview" id="guest-week" hidden aria-labelledby="week-title">
          <div class="between"><h2 id="week-title">이번 주</h2><span class="meta" id="week-month"></span></div>
          <ol id="week-days"></ol>
        </section>
      </div>
    </main>
  </div>
  <dialog id="login-dialog" aria-labelledby="login-title">
    <form method="dialog"><button class="close-dialog quiet" aria-label="닫기">×</button></form>
    <h2 id="login-title">로그인</h2>
    <a class="button" id="discord-login" hidden>Discord로 로그인</a>
    <p class="subtle" id="login-message" hidden></p>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
